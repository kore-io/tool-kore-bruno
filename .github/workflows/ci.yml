# CI do tool-kore-bruno (ADR "GitHub Actions para CI-CD", decisões 145 e 160): roda em todo
# push, em qualquer branch; o PR mostra o resultado do último push. Não chama a API: valida a
# sintaxe dos .bru com o parser oficial do Bruno e barra segredo versionado (ADR de ambientes
# e segredos). A execução das requisições entra depois, contra a homologação.
name: CI

# Actions fixadas pelo SHA do commit (cadeia de fornecimento); a tag fica no comentário.

on:
  push:

permissions:
  contents: read

# Um push novo cancela o anterior na mesma branch, menos na main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  commitlint:
    name: Commits (Conventional Commits)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1

  check:
    name: Formatação, coleção e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A versão do pnpm vem do packageManager do package.json; a do Node, do .nvmrc.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm validate
      - run: pnpm test
